<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бойцовский Клуб: Мини-Бой</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid #444;
            background-color: #222;
            display: block;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            color: white;
            text-align: center;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls">
        <p>Игрок 1: A (влево), D (вправо), W (прыжок), ПРОБЕЛ (атака)</p>
        <p>Игрок 2 (Враг): Стрелки ← → для движения, ↑ для прыжка, ENTER для атаки</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Игровые объекты
        const player1 = {
            x: 100,
            y: 300,
            width: 40,
            height: 60,
            color: '#4CAF50',
            health: 100,
            maxHealth: 100,
            velocityY: 0,
            isJumping: false,
            isAttacking: false,
            attackCooldown: 0
        };

        const player2 = {
            x: 660,
            y: 300,
            width: 40,
            height: 60,
            color: '#F44336',
            health: 100,
            maxHealth: 100,
            velocityY: 0,
            isJumping: false,
            isAttacking: false,
            attackCooldown: 0
        };

        const gravity = 0.7;
        const groundY = 360; // Верхняя граница земли

        // Управление
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') e.preventDefault(); // Предотвращаем прокрутку страницы
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Логика атаки
        function handleAttack(player, opponent) {
            if (player.attackCooldown > 0) return;
            
            player.isAttacking = true;
            player.attackCooldown = 30; // Задержка между атаками в кадрах

            // Проверка попадания (упрощённая)
            const attackRange = 60;
            const playerCenter = player.x + player.width / 2;
            const opponentCenter = opponent.x + opponent.width / 2;
            const distance = Math.abs(playerCenter - opponentCenter);

            if (distance < attackRange) {
                opponent.health -= 10;
                if (opponent.health < 0) opponent.health = 0;
            }

            // Сброс анимации атаки через некоторое время
            setTimeout(() => { player.isAttacking = false; }, 200);
        }

        // Обновление состояния игроков
        function updatePlayer(player, opponent, moveLeftKey, moveRightKey, jumpKey, attackKey) {
            // Движение по горизонтали
            const speed = 4;
            if (keys[moveLeftKey] && player.x > 0) {
                player.x -= speed;
            }
            if (keys[moveRightKey] && player.x + player.width < canvas.width) {
                player.x += speed;
            }

            // Прыжок
            if (keys[jumpKey] && !player.isJumping) {
                player.velocityY = -12;
                player.isJumping = true;
            }

            // Атака
            if (keys[attackKey]) {
                handleAttack(player, opponent);
            }

            // Гравитация
            player.velocityY += gravity;
            player.y += player.velocityY;

            // Приземление
            if (player.y + player.height > groundY) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // Уменьшение кулдауна атаки
            if (player.attackCooldown > 0) player.attackCooldown--;
        }

        // Отрисовка
        function drawPlayer(player) {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Индикатор атаки
            if (player.isAttacking) {
                ctx.fillStyle = 'yellow';
                ctx.fillRect(player.x + player.width, player.y + 10, 20, 40);
            }
        }

        function drawHealthBar(player, x, y, label) {
            const barWidth = 200;
            const barHeight = 20;
            const healthPercentage = player.health / player.maxHealth;

            // Фон
            ctx.fillStyle = '#555';
            ctx.fillRect(x, y, barWidth, barHeight);

            // Здоровье
            ctx.fillStyle = healthPercentage > 0.5 ? '#4CAF50' : healthPercentage > 0.2 ? '#FFC107' : '#F44336';
            ctx.fillRect(x, y, barWidth * healthPercentage, barHeight);

            // Рамка
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, barWidth, barHeight);

            // Подпись
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText(label, x, y - 10);
        }

        function drawWinner() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';

            if (player1.health <= 0) {
                ctx.fillText('Победил Игрок 2!', canvas.width / 2, canvas.height / 2);
            } else if (player2.health <= 0) {
                ctx.fillText('Победил Игрок 1!', canvas.width / 2, canvas.height / 2);
            }

            ctx.font = '24px Arial';
            ctx.fillText('Нажмите R для перезапуска', canvas.width / 2, canvas.height / 2 + 60);
            ctx.textAlign = 'left';
        }

        // Игровой цикл
        function gameLoop() {
            // Очистка canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фон
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#555';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Обновление игроков (если игра не окончена)
            if (player1.health > 0 && player2.health > 0) {
                // Игрок 1
                updatePlayer(player1, player2, 'a', 'd', 'w', ' ');
                // Игрок 2 (враг)
                updatePlayer(player2, player1, 'arrowleft', 'arrowright', 'arrowup', 'enter');
            } else {
                // Обработка перезапуска
                if (keys['r']) {
                    player1.health = player1.maxHealth;
                    player2.health = player2.maxHealth;
                    player1.x = 100;
                    player2.x = 660;
                    player1.y = 300;
                    player2.y = 300;
                    player1.velocityY = 0;
                    player2.velocityY = 0;
                    player1.isJumping = false;
                    player2.isJumping = false;
                }
            }

            // Отрисовка
            drawPlayer(player1);
            drawPlayer(player2);
            drawHealthBar(player1, 20, 30, 'Игрок 1');
            drawHealthBar(player2, canvas.width - 220, 30, 'Игрок 2');

            if (player1.health <= 0 || player2.health <= 0) {
                drawWinner();
            }

            requestAnimationFrame(gameLoop);
        }

        // Запуск игры
        gameLoop();
    </script>
</body>
</html>
